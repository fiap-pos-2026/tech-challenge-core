services:
  postgres:
    image: postgres:18.4-alpine
    container_name: tech-challenge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: techbase
      POSTGRES_USER: techdev
      POSTGRES_PASSWORD: techdevpw
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdev -d techbase"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tech-challenge-redis
    ports:
      - "6379:6379"
    command: redis-server --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: tech-challenge-mailpit
    ports:
      - "8025:8025"   # web UI — acesse http://localhost:8025 para ver os e-mails
      - "1025:1025"   # SMTP

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: tech-challenge-core
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JDBC_HOST: postgres
      JDBC_PORT: 5432
      JDBC_SERVICENAME: techbase
      JDBC_USERNAME: techdev
      JDBC_PASSWORD: techdevpw
      JWT_PUBLIC_KEY: file:/run/certs/dev-public.pem
      JWT_PRIVATE_KEY: file:/run/certs/dev-private.pem
      LIQUIBASE_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ADMIN_INITIAL_PASSWORD: "SenhaForte@2026!"   # opcional — gerada aleatoriamente se omitida
    volumes:
      - ./core/src/main/resources/certs:/run/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/core/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
