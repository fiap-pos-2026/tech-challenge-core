# Exemplo de Secret — NÃO é aplicado pelo Kustomize e NÃO deve conter valores reais.
#
# Crie o Secret real direto no cluster (fora do git):
#
#   kubectl -n tech-challenge create secret generic tech-challenge-core-secret \
#     --from-literal=jdbc-username=techdev \
#     --from-literal=jdbc-password='<senha-do-postgres>' \
#     --from-literal=mail-username='<usuario-smtp>' \
#     --from-literal=mail-password='<senha-smtp>' \
#     --from-literal=new-relic-license-key='<NEW_RELIC_LICENSE_KEY>' \
#     --from-literal=auth-db-reader-password='<senha-usuario-leitura-lambda>' \
#     --from-file=jwt-public-key=./public.pem \
#     --from-file=jwt-private-key=./private.pem
#
# Para o microk8s local com Mailpit, usuário e senha de SMTP podem ficar vazios.
# new-relic-license-key é opcional: sem ele o core sobe sem -javaagent.
# auth-db-reader-password é opcional: com ele o Liquibase cria/atualiza o usuário auth_lambda_reader
# (só SELECT em colunas de customers), usado pela Lambda de autenticação.
apiVersion: v1
kind: Secret
metadata:
  name: tech-challenge-core-secret
  namespace: tech-challenge
type: Opaque
stringData:
  jdbc-username: CHANGE_ME
  jdbc-password: CHANGE_ME
  mail-username: CHANGE_ME
  mail-password: CHANGE_ME
  new-relic-license-key: CHANGE_ME_OPTIONAL
  auth-db-reader-password: CHANGE_ME_OPTIONAL
  jwt-public-key: |
    -----BEGIN PUBLIC KEY-----
    CHANGE_ME
    -----END PUBLIC KEY-----
  jwt-private-key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
