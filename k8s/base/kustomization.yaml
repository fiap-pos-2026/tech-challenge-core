apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tech-challenge

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: tech-challenge-core
      app.kubernetes.io/part-of: tech-challenge

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

# secret.example.yaml é só template: o Secret real é criado no cluster, fora do git
