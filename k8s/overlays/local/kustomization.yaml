apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# No CI, o job `deploy` substitui esta linha pela imagem exata publicada no run
# (ghcr.io/<owner-do-repo>/tech-challenge-core:<sha>). O valor abaixo é só o default
# para `kubectl apply -k` manual — ajuste para o seu namespace do GHCR se necessário.
images:
  - name: tech-challenge-core
    newName: ghcr.io/johncgo/tech-challenge-core
    newTag: latest

patches:
  - path: patch-service-nodeport.yaml
  - path: patch-deployment-local.yaml
