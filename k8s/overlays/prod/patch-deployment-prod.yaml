apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      # Espalha as réplicas entre nodes/zonas
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tech-challenge-core
      containers:
        - name: core
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /core/actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 48
