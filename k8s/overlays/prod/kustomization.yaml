apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ESBOÇO de produção — ainda sem job no CI (entra depois que homolog estiver estável).
# Diferenças para o homolog:
#   - namespace próprio e mais réplicas / HPA mais largo
#   - Redis e SMTP gerenciados (ElastiCache / provedor de e-mail) em vez de pods no cluster
#   - runtime.env gerado pelo CI de prod (host do RDS, Redis, SMTP, modo de autenticação, issuer/JWKS)

namespace: tech-challenge-prod

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: tech-challenge-core-config
    behavior: merge
    envs:
      - runtime.env
    options:
      disableNameSuffixHash: true

patches:
  - path: patch-deployment-prod.yaml
  - path: patch-hpa-prod.yaml
  # Imagem vem do ECR com a role dos nodes
  - target:
      kind: Deployment
      name: core
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
