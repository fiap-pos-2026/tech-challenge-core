name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Namespace do GHCR = owner do repositório que está rodando o workflow.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tech-challenge-core

jobs:
  # Build + testes em runner GitHub-hosted. Falha aqui bloqueia os estágios seguintes.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: ./gradlew :core:assemble --console=plain

      - name: Test
        env:
          IGNORE_TEST_FAILURES: "false"
        run: ./gradlew :core:test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/test
          retention-days: 7

  # Publica a imagem no GHCR (não roda em pull request).
  docker-image:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f core/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # Aplica o overlay Kustomize no cluster já provisionado
  # (tech-challenge-k8s-infra / ambiente local com kubectl configurado).
  # Cluster, VPC e RDS NÃO são provisionados neste repositório.
  deploy:
    name: Deploy (kubectl apply -k)
    needs: docker-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, wsl2, microk8s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure pull secret (ghcr-pull)
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          ns=tech-challenge
          if [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "GHCR_PULL_TOKEN ausente — pulando ghcr-pull (pacote público ou secret já existente)"
            exit 0
          fi
          kubectl get namespace "$ns" >/dev/null
          kubectl -n "$ns" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.repository_owner }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure app secret (tech-challenge-core-secret)
        shell: bash
        env:
          JDBC_USERNAME: ${{ secrets.JDBC_USERNAME }}
          JDBC_PASSWORD: ${{ secrets.JDBC_PASSWORD }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ns=tech-challenge

          jdbc_user="${JDBC_USERNAME:-}"
          jdbc_pass="${JDBC_PASSWORD:-}"
          if [ -z "$jdbc_user" ] || [ -z "$jdbc_pass" ]; then
            if kubectl -n "$ns" get secret postgres-credentials >/dev/null 2>&1; then
              echo "jdbc: usando Secret postgres-credentials do cluster"
              jdbc_user=$(kubectl -n "$ns" get secret postgres-credentials -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)
              jdbc_pass=$(kubectl -n "$ns" get secret postgres-credentials -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
            else
              echo "Defina os secrets JDBC_USERNAME e JDBC_PASSWORD (ou provisione o banco via tech-challenge-db-infra)." >&2
              exit 1
            fi
          else
            echo "jdbc: usando GitHub Secrets JDBC_USERNAME / JDBC_PASSWORD"
          fi

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          if [ -n "${JWT_PUBLIC_KEY:-}" ] && [ -n "${JWT_PRIVATE_KEY:-}" ]; then
            echo "chaves JWT: usando GitHub Secrets"
            printf '%s\n' "$JWT_PUBLIC_KEY"  > "$tmp/public.pem"
            printf '%s\n' "$JWT_PRIVATE_KEY" > "$tmp/private.pem"
          else
            echo "chaves JWT: usando core/src/main/resources/certs/dev-*.pem do repo"
            cp core/src/main/resources/certs/dev-public.pem  "$tmp/public.pem"
            cp core/src/main/resources/certs/dev-private.pem "$tmp/private.pem"
          fi

          kubectl -n "$ns" create secret generic tech-challenge-core-secret \
            --from-literal=jdbc-username="$jdbc_user" \
            --from-literal=jdbc-password="$jdbc_pass" \
            --from-literal=mail-username="noreply@tech.local" \
            --from-literal=mail-password="" \
            --from-file=jwt-public-key="$tmp/public.pem" \
            --from-file=jwt-private-key="$tmp/private.pem" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render and apply Kustomize overlay
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${GITHUB_SHA}"
          kubectl kustomize k8s/overlays/local \
            | sed -E "s#image: ghcr\.io/[^:[:space:]]+/tech-challenge-core:[^[:space:]]+#image: ${image}#g" \
            | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl -n tech-challenge rollout status deployment/core --timeout=180s
