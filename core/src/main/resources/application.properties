# Spring #
spring.application.name=tech-challenge-core
spring.output.ansi.enabled=always
spring.jpa.open-in-view=false
spring.profiles.default=dev

# Server #
server.servlet.context-path=/core
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# Actuator #
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# SpringDoc #
openapi.service.title=Tech Challenge
openapi.service.description=FIAP Tech Challenge
openapi.service.version=1.0.0
springdoc.show-actuator=true
springdoc.swagger-ui.display-request-duration=true
springdoc.pre-loading-enabled=true
springdoc.writer-with-order-by-keys=true

# Logging #
logging.level.root=ERROR
logging.level.org.springframework.boot=INFO
logging.level.br.com.fiap.pos.tech_challenge.core.infrastructure.security.AdminCredentialInitializer=WARN
logging.group.sql=org.hibernate.SQL,org.hibernate.orm.jdbc.bind,org.springframework.jdbc.core,org.springframework.transaction
logging.group.sql-verbose=org.hibernate.SQL,org.hibernate.orm.jdbc.bind,org.springframework.jdbc.core,org.springframework.transaction,org.springframework.data.jpa.repository.query,org.hibernate.stat,org.hibernate.SQL_SLOW,com.zaxxer.hikari

# Info #
info.app.version=@version@
info.gradle.version=@gradle_version@

# Liquibase #
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.jpa.hibernate.ddl-auto=none

# Mail \u2014 defina MAIL_HOST via env var para habilitar envio real #
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.test-connection=false
management.health.mail.enabled=false

# Rework #
app.rework.hourly-rate=${REWORK_HOURLY_RATE:150.00}

